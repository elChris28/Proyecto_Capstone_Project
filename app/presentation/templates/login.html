<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acceso · VetAssistant IA</title><style>body{font-family:Arial,sans-serif;background:#eef4f7;color:#1a3040;display:grid;min-height:95vh;place-items:center}.box{background:white;box-shadow:0 6px 22px #0001;border-radius:12px;padding:32px;width:min(340px,90vw)}label{display:block;margin:18px 0 5px}input{display:block;width:100%;box-sizing:border-box;padding:12px;border:1px solid #b6c2cf;border-radius:7px}button{margin-top:22px;padding:13px;border:0;background:#087d70;color:white;width:100%;border-radius:7px;cursor:pointer}.error{color:#ab2318}</style></head><body><div class="box"><h1>VetAssistant IA</h1><p>Acceso al sistema de inventario predictivo</p>{% if error %}<p class="error">{{ error }}</p>{% endif %}<form method="post"><label>Usuario</label><input name="username" required autocomplete="username"><label>Contraseña</label><input type="password" name="password" required autocomplete="current-password"><button>Iniciar sesión</button></form></div></body></html>
